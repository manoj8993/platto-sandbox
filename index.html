<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%23F2B705'/><circle cx='16' cy='16' r='8' fill='%231E2A3A'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Platto Sandbox</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Tailwind is loaded from its CDN so any screen can use utility classes without a build step. -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ['"Instrument Sans"', 'system-ui', 'sans-serif'] },
            colors: {
              ink: '#1E2A3A',       // text, dark surfaces
              saffron: '#F2B705',   // primary actions
              basil: '#2F7D5B',     // success, on time
              tomato: '#C8413A',    // problems, late
              paper: '#F7F7F3',     // app background
              line: '#E3E3DC',      // borders
              mist: '#6B7280',      // secondary text
            },
          },
        },
      };
    </script>
  </head>
  <body class="bg-[#E9EAE4] font-sans text-ink antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
